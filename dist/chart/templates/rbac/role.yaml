{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: hermaeus-operator-manager-role
rules:
- apiGroups:
  - doc.hermaeus.io
  resources:
  - documents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - doc.hermaeus.io
  resources:
  - documents/finalizers
  verbs:
  - update
- apiGroups:
  - doc.hermaeus.io
  resources:
  - documents/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
